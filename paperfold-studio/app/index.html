<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f0"><title>折纸手帖</title><link rel="stylesheet" href="./style.css"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"></head>
<body><main>
<header><div class="brand"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M3 11 20 3l13 7-14 22Z" fill="#285848"/><path d="m3 11 16 21 1-29Z" fill="#a4b7a1"/><path d="M3 11 20 3l-8 15Z" fill="#587b67"/></svg>折纸手帖</div><button id="language" class="jump" type="button">English</button></header>
<section id="library">
<div class="library-heading"><h1 id="library-title"></h1><p id="library-intro"></p>
<div class="library-actions"><button class="play" id="resume-course" hidden></button>
<button class="jump" id="share-app" type="button"></button></div>
<p id="share-feedback" role="status" hidden></p><input id="share-address" readonly hidden></div>
<div class="catalog-tools"><label for="course-search" id="search-label"></label>
<input type="search" id="course-search" autocomplete="off">
<div id="catalog-filters" class="catalog-filters" role="group"></div></div>
<p id="catalog-count" role="status"></p><div id="course-grid"></div><p id="no-results" hidden></p></section>
<section id="lesson-view" hidden>
<button id="library-link" class="library-link" type="button"></button>
<div class="heading"><div><h1 id="course-name"></h1><p id="course-detail"></p></div><button id="focus" class="jump">练习塞入口袋 <i>↗</i></button></div>
<div class="workspace"><section class="viewer" aria-label="可旋转的三维折纸">
<div id="stage"><div class="viewbar"><button id="front">正面</button><button id="angle">斜视</button><button id="side">侧面</button><button id="back">背面</button></div>
<canvas id="shadow" aria-hidden="true"></canvas>
<canvas id="fold-guide" aria-hidden="true"></canvas>
<div class="zoom"><button id="minus" aria-label="缩小模型">−</button><button id="plus" aria-label="放大模型">＋</button></div>
<div class="look" hidden id="look" aria-label="纸层显示"><button id="solid">实体</button><button id="xray">透视</button><button id="spread">分层</button><button id="cutaway">剖视</button></div>
<span id="mouth-label" hidden>袋口</span>
<span id="front-wall" class="wall-label" hidden>前壁</span>
<span id="back-wall" class="wall-label" hidden>后壁</span>
<span id="tip-stop" class="wall-label" hidden>纸尖落点</span>
<button id="handle" aria-label="拖动纸角折叠，也可用方向键调整"><span></span></button>
<div id="failure" role="alert" hidden><p id="load-message"></p><button id="reload" onclick="location.reload()"></button></div></div>
<div id="legend" hidden><span id="legend-back"></span><span id="legend-front"></span><span id="legend-moving"></span></div>
<div id="replays" hidden role="group" aria-label="Replay a pocket action">
<button data-clip="0" id="clip-open"></button>
<button data-clip="1" id="clip-tuck"></button>
<button data-clip="2" id="clip-flatten"></button>
</div><div class="gesture"><span class="ring"></span><span id="gesture-text"></span></div></section>
<section class="lesson"><div class="step-line"><span id="current-fold"></span><strong id="count">01 / 06</strong></div>
<div class="rail" id="rail" aria-label="选择步骤"></div><h2 id="title"></h2><p id="instruction"></p>
<div class="tip"><span id="tipLabel">对照</span><span id="tip"></span></div>
<div class="controls"><label for="scrub"><span id="progress-label"></span><output id="percent">0%</output></label><input id="scrub" type="range" min="0" max="1000" step="1" value="0">
<button id="play" class="play"></button><button id="mark-done" class="play" hidden></button><div class="nav"><button id="prev">← 上一步</button><button id="next">下一步 →</button></div></div></section></div>
</section></main><script type="module" src="./app.js"></script><script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(console.warn)</script></body></html>
