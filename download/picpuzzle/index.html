<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">

<body style="--accent:#814260">

<script>
if (/^zh(?:-|$)/i.test(navigator.language)) {
  document.documentElement.lang = 'zh';
  const name = document.getElementById('app-name');

  document.title = name.dataset.zh + ' · Android';
  document.getElementById('platform').textContent = '适用于安卓手机和平板';
  document.getElementById('install').textContent = '下载安装';
  document.getElementById('stores').setAttribute('aria-label', '应用商店');
}
